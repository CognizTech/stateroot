name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to embed in manually built release artifacts
        required: true
        default: 0.1.0
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # git2 is built with vendored libgit2 (workspace feature
      # `vendored-libgit2`), so no system libgit2 is needed on either OS.
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  build-release:
    name: build ${{ matrix.artifact }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: stateroot-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: stateroot-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: stateroot-macos-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p stateroot-cli

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/stateroot.exe dist/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/stateroot dist/${{ matrix.artifact }}
            strip dist/${{ matrix.artifact }} || true
          fi

      # Windows releases fail closed until CognizTech's Artifact Signing
      # identity and GitHub OIDC credentials are configured. The inner CLI
      # must be signed before WiX embeds it in the MSI.
      - name: Sign in to Azure for Artifact Signing
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows CLI
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows CLI signature
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist/stateroot-windows-x64.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Windows CLI signature is $($signature.Status), expected Valid."
          }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6

      - name: Build Windows GUI installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 `
            -Version '${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}' `
            -SourceExe 'dist/stateroot-windows-x64.exe' `
            -OutputMsi 'dist/StateRootSetup-x64.msi'

      # Sign the finished container separately. This signature covers the MSI
      # itself; it does not replace the signature on the embedded CLI above.
      - name: Sign Windows GUI installer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows GUI installer signature
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist/StateRootSetup-x64.msi'
          if ($signature.Status -ne 'Valid') {
            throw "Windows MSI signature is $($signature.Status), expected Valid."
          }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/

  release:
    name: publish release (binaries + checksums.txt)
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The updater verifies downloads against this file (sha256sum format).
      - name: Generate checksums.txt
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum stateroot-* StateRootSetup-* > checksums.txt
          cat checksums.txt

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
