name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Optional base version for manually built preview artifacts
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Only the newest main-branch push should update the rolling prerelease.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    # PRs and ordinary main pushes only. Skip on v* tags (the tagged release
    # builds its own binaries) and when the commit message contains [skip tests].
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main' &&
        !contains(github.event.head_commit.message, '[skip tests]')
      )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      # git2 is built with vendored libgit2 (workspace feature
      # `vendored-libgit2`), so no system libgit2 is needed on either OS.
      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  preview-version:
    name: calculate rolling preview version
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip tests]'))
    runs-on: ubuntu-latest
    outputs:
      display: ${{ steps.version.outputs.display }}
      msi: ${{ steps.version.outputs.msi }}
    steps:
      - uses: actions/checkout@v7

      - name: Calculate automatically increasing version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          base="$REQUESTED_VERSION"
          if [ -z "$base" ]; then
            base=$(awk -F '"' '/^version = "/ { print $2; exit }' Cargo.toml)
          fi
          if [[ ! "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Invalid three-part base version: $base" >&2
            exit 1
          fi
          build=$GITHUB_RUN_NUMBER
          if [ "$build" -gt 65535 ]; then
            echo "GitHub run number $build exceeds the MSI build-version limit" >&2
            exit 1
          fi
          display="${base}-dev.${build}"
          msi="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${build}"
          echo "display=$display" >> "$GITHUB_OUTPUT"
          echo "msi=$msi" >> "$GITHUB_OUTPUT"
          echo "Rolling preview: $display (MSI $msi)"

  build-preview:
    name: preview ${{ matrix.artifact }}
    needs: [test, preview-version]
    if: needs.preview-version.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS (aarch64-apple-darwin) intentionally omitted — costly runners;
        # re-add when shipping a macOS release.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: stateroot-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: stateroot-windows-x64.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          STATEROOT_BUILD_VERSION: ${{ needs.preview-version.outputs.display }}
        run: cargo build --release --target ${{ matrix.target }} -p stateroot-cli

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/stateroot.exe dist/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/stateroot dist/${{ matrix.artifact }}
            strip dist/${{ matrix.artifact }} || true
          fi

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6

      - name: Build Windows GUI installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 `
            -Version '${{ needs.preview-version.outputs.msi }}' `
            -SourceExe 'dist/stateroot-windows-x64.exe' `
            -OutputMsi 'dist/StateRootSetup-x64.msi'

      - name: Smoke-test Windows GUI installer
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        run: |
          ./packaging/windows/test-installer.ps1 `
            -Msi 'dist/StateRootSetup-x64.msi' `
            -ExpectedVersion '${{ needs.preview-version.outputs.display }}'

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os == 'Windows' && 'StateRoot-windows-x64-installer-and-portable' || matrix.artifact }}
          path: dist/
          retention-days: 14

  rolling-prerelease:
    name: publish rolling prerelease
    needs: [preview-version, build-preview]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download preview artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums.txt
        run: |
          cd dist
          sha256sum stateroot-* StateRootSetup-* > checksums.txt
          cat checksums.txt

      - name: Move rolling tag to this commit
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly

      - name: Replace rolling prerelease assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: StateRoot ${{ needs.preview-version.outputs.display }} (rolling preview)
          body: |
            Automated preview of `${{ github.sha }}` from `main`.

            **Windows installation:** download and run `StateRootSetup-x64.msi`.
            `stateroot-windows-x64.exe` is the portable command-line binary, not an installer.

            These preview artifacts are unsigned. Tagged `v*` Windows
            installers are unsigned until Azure Artifact Signing is
            re-enabled on the `release` environment.
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: build ${{ matrix.artifact }}
    needs: test
    if: |
      always() &&
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ${{ matrix.os }}
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # macOS (aarch64-apple-darwin) intentionally omitted — costly runners;
        # re-add when shipping a macOS release.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: stateroot-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: stateroot-windows-x64.exe
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} -p stateroot-cli

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/stateroot.exe dist/${{ matrix.artifact }}
          else
            cp target/${{ matrix.target }}/release/stateroot dist/${{ matrix.artifact }}
            strip dist/${{ matrix.artifact }} || true
          fi

      # Authenticode is opt-in until Azure identity validation completes.
      # Set AZURE_ARTIFACT_SIGNING_ENABLED=true on the `release` environment
      # to sign the CLI before WiX embeds it, then sign the MSI.
      - name: Skip Authenticode signing
        if: runner.os == 'Windows' && vars.AZURE_ARTIFACT_SIGNING_ENABLED != 'true'
        shell: pwsh
        run: |
          Write-Host "AZURE_ARTIFACT_SIGNING_ENABLED is not true; shipping unsigned Windows CLI and MSI."

      - name: Sign in to Azure for Artifact Signing
        if: runner.os == 'Windows' && vars.AZURE_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows CLI
        if: runner.os == 'Windows' && vars.AZURE_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows CLI signature
        if: runner.os == 'Windows' && vars.AZURE_ARTIFACT_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist/stateroot-windows-x64.exe'
          if ($signature.Status -ne 'Valid') {
            throw "Windows CLI signature is $($signature.Status), expected Valid."
          }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          wix extension add -g WixToolset.Util.wixext/4.0.6

      - name: Build Windows GUI installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./packaging/windows/build.ps1 `
            -Version '${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}' `
            -SourceExe 'dist/stateroot-windows-x64.exe' `
            -OutputMsi 'dist/StateRootSetup-x64.msi'

      # Sign the finished container separately. This signature covers the MSI
      # itself; it does not replace the signature on the embedded CLI above.
      - name: Sign Windows GUI installer
        if: runner.os == 'Windows' && vars.AZURE_ARTIFACT_SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Windows GUI installer signature
        if: runner.os == 'Windows' && vars.AZURE_ARTIFACT_SIGNING_ENABLED == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature 'dist/StateRootSetup-x64.msi'
          if ($signature.Status -ne 'Valid') {
            throw "Windows MSI signature is $($signature.Status), expected Valid."
          }
          Write-Host "Verified publisher: $($signature.SignerCertificate.Subject)"

      - name: Smoke-test Windows GUI installer
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        run: |
          ./packaging/windows/test-installer.ps1 `
            -Msi 'dist/StateRootSetup-x64.msi' `
            -ExpectedVersion '${{ github.ref_name }}'

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os == 'Windows' && 'StateRoot-windows-x64-installer-and-portable' || matrix.artifact }}
          path: dist/

  release:
    name: publish release (binaries + checksums.txt)
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The updater verifies downloads against this file (sha256sum format).
      - name: Generate checksums.txt
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum stateroot-* StateRootSetup-* > checksums.txt
          cat checksums.txt

      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body: |
            **Windows installation:** download and run `StateRootSetup-x64.msi`.
            `stateroot-windows-x64.exe` is the portable command-line binary, not an installer.

            Windows assets are currently unsigned. SmartScreen may warn;
            that is expected until Authenticode signing is re-enabled.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
